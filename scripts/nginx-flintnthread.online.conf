# Full nginx site for flintnthread.online (Ubuntu).
# Copy to: /etc/nginx/sites-available/flintnthread.online
# Enable: sudo ln -sf /etc/nginx/sites-available/flintnthread.online /etc/nginx/sites-enabled/
# Test:   sudo nginx -t && sudo systemctl reload nginx
#
# Requires systemd services: flint-user (8080), flint-admin (8082), flint-seller (8083)
# Deploy: bash scripts/deploy-vps.sh

server {
    listen 80;
    server_name flintnthread.online www.flintnthread.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flintnthread.online www.flintnthread.online;

    # SSL — use certbot: sudo certbot --nginx -d flintnthread.online -d www.flintnthread.online
    ssl_certificate     /etc/letsencrypt/live/flintnthread.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flintnthread.online/privkey.pem;

    client_max_body_size 20M;

    # Admin app API (MUST be before /api/)
    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Seller service (adjust paths if your seller API uses different prefixes)
    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:8083;
        include /etc/nginx/proxy_params;
    }

    # User / ecommerce API + auth
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location ^~ /invoices/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # SPA / static site (adjust root to your frontend build)
    location / {
        root /var/www/flintnthread;
        try_files $uri $uri/ /index.html;
    }
}
